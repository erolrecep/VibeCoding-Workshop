[project]
name = "2048"
version = "0.1.0"
description = "Interactive 2048 Python Web App with SQLite Persistence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
]

[project.scripts]
2048 = "2048:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
